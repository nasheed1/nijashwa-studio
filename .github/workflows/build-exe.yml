name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    name: Build EXE
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (for the vendor libraries)
        run: npm install --no-audit --no-fund
      - name: Copy vendor libraries into www/vendor
        run: npm run prepare:web
      - name: App icon for the EXE
        shell: bash
        run: |
          mkdir -p desktop/build
          cp assets/icon-only.png desktop/build/icon.png
      - name: Build the portable EXE
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: NijashwaStudio-exe
          path: desktop/dist/NijashwaStudio.exe
          if-no-files-found: error
      - name: Attach EXE to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          files: desktop/dist/NijashwaStudio.exe
