name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every inline script must be allowed by the CSP
        run: node scripts/csp-hashes.mjs --check

  apk:
    name: Build APK
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to a GitHub Release on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy vendor libraries into www/vendor
        run: npm run prepare:web

      - name: Create the Android project (android/ is generated, not committed)
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npx cap add android && node scripts/android-patch.mjs

      - name: Generate launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build APK (signed release if keystore secrets exist, otherwise debug)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$GITHUB_WORKSPACE/NijashwaStudio-release.apk" \
              "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NijashwaStudio-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NijashwaStudio-apk
          path: NijashwaStudio-*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NijashwaStudio-*.apk
          generate_release_notes: true
